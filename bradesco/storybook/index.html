<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Storybook Bradesco · Gabriel Moreira</title>
  <meta name="description" content="Component explorer for the Bradesco income tax statements case: buttons, chips, cards, sheets and loading states rebuilt in HTML and CSS from the Figma file." />
  <meta name="theme-color" content="#cc092f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400;600&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" sizes="any" />

  <link rel="stylesheet" href="../ui/bds.css" />
  <link rel="stylesheet" href="storybook.css" />
</head>
<body>
  <header class="sb-header">
    <button class="sb-menu" id="sb-menu" type="button" aria-label="Stories"><span></span><span></span><span></span></button>
    <a class="sb-brand" href="../" data-keep-lang>
      <img src="../assets/symbol-red.svg" width="28" height="28" alt="" />
      <b>Storybook</b><span>Bradesco</span>
    </a>
    <nav class="sb-top">
      <a href="../" data-keep-lang data-t="case">Case study</a>
      <a href="../prototype/" data-keep-lang data-t="proto">Prototype</a>
    </nav>
    <div class="sb-lang" role="group" aria-label="Language">
      <button type="button" data-l="en" aria-pressed="true">EN</button>
      <button type="button" data-l="pt" aria-pressed="false">PT</button>
    </div>
  </header>

  <div class="sb-shell">
    <aside class="sb-side">
      <input id="sb-search" class="sb-search" type="search" placeholder="Find components" aria-label="Find components" />
      <div id="sb-nav" class="sb-nav"></div>
    </aside>

    <main class="sb-main">
      <aside class="sb-notice" role="note">
        <span class="sb-notice-tag" data-t="noticeTag">Independent recreation</span>
        <p data-t="notice"></p>
      </aside>

      <div class="sb-head">
        <div>
          <span class="sb-eyebrow" id="sb-group"></span>
          <h1 id="sb-title"></h1>
          <p id="sb-desc"></p>
        </div>
        <button class="sb-replay" id="sb-replay" type="button" hidden><span data-t="replay">Replay</span></button>
      </div>

      <section class="sb-canvas" id="sb-canvas" data-bg="light" aria-label="Preview">
        <div class="sb-bgbar">
          <span data-t="bg">Background</span>
          <div class="sb-bg" role="group">
            <button type="button" data-bg="light" aria-pressed="true" data-t="light">Light</button>
            <button type="button" data-bg="brand" aria-pressed="false" data-t="brand">Brand</button>
            <button type="button" data-bg="dark" aria-pressed="false" data-t="dark">Dark</button>
          </div>
        </div>
        <div id="sb-stage" class="sb-stage"></div>
      </section>

      <section class="sb-dock">
        <div class="sb-tabs" role="tablist">
          <button type="button" role="tab" data-tab="controls" aria-selected="true" data-t="controls">Controls</button>
          <button type="button" role="tab" data-tab="code" aria-selected="false"><svg class="bds-icon sb-lock" aria-hidden="true"><use href="#i-lock"/></svg><span data-t="code">Code</span></button>
          <button type="button" role="tab" data-tab="specs" aria-selected="false" data-t="specs">Specs</button>
        </div>
        <div id="sb-panel" class="sb-panel"></div>
      </section>
    </main>
  </div>

  <script src="../ui/bds-icons.js"></script>
  <script src="../ui/bds.js" data-assets="../assets/"></script>
  <script src="storybook.js"></script>
</body>
</html>
