<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Storybook GaYa · Gabriel Moreira</title>
  <meta name="description" content="Component explorer for the GaYa design system case: tokens, themes (light and dark) and 17 components rebuilt in HTML and CSS." />
  <meta name="theme-color" content="#0f4a3a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" sizes="any" />
  <link rel="stylesheet" href="../ui/gaya.css" />
  <link rel="stylesheet" href="storybook.css" />
</head>
<body>
  <header class="sb-header">
    <button class="sb-menu" id="sb-menu" type="button" aria-label="Stories"><span></span><span></span><span></span></button>
    <a class="sb-brand" href="../" data-keep-lang><img class="sb-mark" src="../assets/gaya-mark.svg" alt="GaYa" width="32" height="32" /><b>Storybook</b><span>GaYa</span></a>
    <nav class="sb-top">
      <a href="../" data-keep-lang data-t="case">Case study</a>
      <a href="../prototype/" data-keep-lang data-t="proto">Prototype</a>
    </nav>
    <div class="sb-lang" role="group" aria-label="Language">
      <button type="button" data-l="en" aria-pressed="true">EN</button>
      <button type="button" data-l="pt" aria-pressed="false">PT</button>
    </div>
  </header>

  <div class="sb-shell">
    <aside class="sb-side">
      <input id="sb-search" class="sb-search" type="search" placeholder="Find components" aria-label="Find components" />
      <div id="sb-nav" class="sb-nav"></div>
    </aside>

    <main class="sb-main">
      <aside class="sb-notice" role="note">
        <span class="sb-notice-tag" data-t="noticeTag">Independent recreation</span>
        <p data-t="notice"></p>
      </aside>

      <div class="sb-head">
        <span class="sb-eyebrow" id="sb-group"></span>
        <h1 id="sb-title"></h1>
        <p id="sb-desc"></p>
      </div>

      <section class="sb-canvas" id="sb-canvas" aria-label="Preview">
        <div class="sb-bgbar">
          <div class="sb-seg" role="group" aria-label="Theme" id="sb-themes">
            <button type="button" data-theme="t1" aria-pressed="true">Theme 1</button>
            <button type="button" data-theme="t2" aria-pressed="false">Theme 2</button>
            <button type="button" data-theme="t3" aria-pressed="false">Theme 3</button>
          </div>
          <div class="sb-seg" role="group" aria-label="Mode" id="sb-modes">
            <button type="button" data-mode="light" aria-pressed="true" data-t="light">Light</button>
            <button type="button" data-mode="dark" aria-pressed="false" data-t="dark">Dark</button>
          </div>
        </div>
        <div id="sb-stage" class="sb-stage gy" data-theme="t1" data-mode="light"></div>
      </section>

      <section class="sb-dock">
        <div class="sb-tabs" role="tablist">
          <button type="button" role="tab" data-tab="controls" aria-selected="true" data-t="controls">Controls</button>
          <button type="button" role="tab" data-tab="usage" aria-selected="false" data-t="usage">Usage</button>
          <button type="button" role="tab" data-tab="specs" aria-selected="false" data-t="specs">Tokens</button>
        </div>
        <div id="sb-panel" class="sb-panel"></div>
      </section>
    </main>
  </div>

  <script src="../ui/gaya.js"></script>
  <script src="storybook.js"></script>
</body>
</html>
